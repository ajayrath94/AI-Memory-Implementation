name: Backend Checks

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Python setup ──────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # ── 3. Install dependencies ──────────────────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 4. Type check ────────────────────────────────────────────────────────
      - name: Type check (pyright)
        run: |
          pip install pyright --quiet
          pyright classifier/ memory/ engine/ routes/ --pythonversion 3.11 || true
        # || true = warn but don't fail yet (codebase has no type stubs for all deps)

      # ── 5. XML validation ────────────────────────────────────────────────────
      - name: Validate pillars.xml
        run: |
          python3 - << 'PYEOF'
          import xml.etree.ElementTree as ET
          import sys

          tree = ET.parse("classifier/pillars.xml")
          root = tree.getroot()
          pillars = root.findall("pillar")

          # Check total count
          total = len(pillars)
          print(f"Total pillars: {total}")
          assert total == 28, f"Expected 28 pillars, got {total}"

          # Check required attributes
          for p in pillars:
              name = p.get("name")
              assert p.get("type") in ("core","emotion","functional","modifier"), \
                  f"{name}: invalid type"
              assert p.get("classification") in ("embedding","keyword"), \
                  f"{name}: invalid classification"

          # Check embedding pillars have examples
          for p in pillars:
              name = p.get("name")
              if p.get("classification") == "embedding":
                  examples = p.findall("examples/example")
                  assert len(examples) >= 5, \
                      f"{name}: needs at least 5 examples, got {len(examples)}"

          # Check keyword pillars have keywords
          for p in pillars:
              name = p.get("name")
              if p.get("classification") == "keyword":
                  keywords = p.findall("keywords/keyword")
                  assert len(keywords) >= 3, \
                      f"{name}: needs at least 3 keywords, got {len(keywords)}"

          # Check priority thresholds exist and are valid
          for p in pillars:
              name = p.get("name")
              pt = p.find("priority_threshold")
              assert pt is not None, f"{name}: missing priority_threshold"
              high   = float(pt.get("high"))
              medium = float(pt.get("medium"))
              low    = float(pt.get("low"))
              assert high > medium > low, \
                  f"{name}: thresholds must be high > medium > low"

          # Check by type counts
          by_type = {}
          for p in pillars:
              t = p.get("type")
              by_type[t] = by_type.get(t, 0) + 1
          print(f"By type: {by_type}")
          assert by_type.get("core")       == 6,  f"Expected 6 core pillars"
          assert by_type.get("emotion")    == 7,  f"Expected 7 emotion pillars"
          assert by_type.get("functional") == 5,  f"Expected 5 functional pillars"
          assert by_type.get("modifier")   == 10, f"Expected 10 modifier pillars"

          print("✅ pillars.xml valid")
          PYEOF

      # ── 6. Import validation (mock Supabase + Google) ────────────────────────
      - name: Validate imports
        env:
          SUPABASE_URL: https://mock.supabase.co
          SUPABASE_KEY: mock-key
          GEMINI_API_KEY: mock-key
          ANTHROPIC_API_KEY: mock-key
          OPENAI_API_KEY: mock-key
        run: |
          python3 - << 'PYEOF'
          import sys, os, types

          # Mock supabase
          mock_sb = types.ModuleType("supabase")
          mock_sb.create_client = lambda url, key: None
          sys.modules["supabase"] = mock_sb

          # Mock supabase_store
          mock_store = types.ModuleType("supabase_store")
          mock_store.get_client = lambda: None
          sys.modules["supabase_store"] = mock_store

          # Mock google genai
          mock_genai = types.ModuleType("google.genai")
          sys.modules["google"] = types.ModuleType("google")
          sys.modules["google.genai"] = mock_genai

          # Now try importing core modules
          try:
              from classifier.pillar_classifier import (
                  ClassifiedInput, CORE_PILLARS, EMOTION_PILLARS,
                  FUNCTIONAL_PILLARS, MODIFIER_PILLARS, DIMENSION_ORDER,
                  get_pillar_defs, _detect_modifiers,
              )
              print(f"✅ classifier imports OK")
              print(f"   DIMENSION_ORDER length: {len(DIMENSION_ORDER)}")
              assert len(DIMENSION_ORDER) == 28, \
                  f"Expected 28 in DIMENSION_ORDER, got {len(DIMENSION_ORDER)}"
          except Exception as e:
              print(f"❌ classifier import failed: {e}")
              sys.exit(1)

          try:
              from memory.cache.cache_memory import (
                  update_cache, get_active_slots, apply_decay, clear_cache,
              )
              print("✅ cache_memory imports OK")
          except Exception as e:
              print(f"❌ cache_memory import failed: {e}")
              sys.exit(1)

          try:
              from memory.decay.decay_memory import track_decay, system_entropy
              print("✅ decay_memory imports OK")
          except Exception as e:
              print(f"❌ decay_memory import failed: {e}")
              sys.exit(1)

          try:
              from memory.recall.recall_memory import (
                  apply_stm_decay, apply_ltm_decay, get_stm, get_ltm,
              )
              print("✅ recall_memory imports OK")
          except Exception as e:
              print(f"❌ recall_memory import failed: {e}")
              sys.exit(1)

          try:
              from memory.learning_rate import (
                  dynamic_lr, update_memory,
                  contradiction_update, reinforcement_update,
              )
              print("✅ learning_rate imports OK")
          except Exception as e:
              print(f"❌ learning_rate import failed: {e}")
              sys.exit(1)

          print("\n✅ All imports passed")
          PYEOF

      # ── 7. Classifier unit tests (no API calls) ──────────────────────────────
      - name: Classifier unit tests
        env:
          SUPABASE_URL: https://mock.supabase.co
          SUPABASE_KEY: mock-key
          GEMINI_API_KEY: mock-key
        run: |
          python3 - << 'PYEOF'
          import sys, types

          # Mock external APIs
          mock_sb = types.ModuleType("supabase")
          mock_sb.create_client = lambda url, key: None
          sys.modules["supabase"] = mock_sb
          mock_store = types.ModuleType("supabase_store")
          mock_store.get_client = lambda: None
          sys.modules["supabase_store"] = mock_store
          sys.modules["google"] = types.ModuleType("google")
          sys.modules["google.genai"] = types.ModuleType("google.genai")

          from classifier.pillar_classifier import (
              _detect_language, _detect_modifiers, _score_priority,
              _get_matrix, get_pillar_defs, DIMENSION_ORDER,
          )

          # Test 1: language detection
          assert _detect_language("Hello how are you") == "en", "English not detected"
          assert _detect_language("Mera ghutna dard kar raha hai") == "hi", "Hindi not detected"
          assert _detect_language("Aaj bahut pain hai") == "hi", "Hinglish not detected"
          print("✅ Language detection")

          # Test 2: modifier detection
          mods = _detect_modifiers("I need this urgently today near my house")
          assert "URGENCY"  in mods, f"URGENCY not detected, got {mods}"
          assert "TEMPORAL" in mods, f"TEMPORAL not detected, got {mods}"
          assert "LOCATION" in mods, f"LOCATION not detected, got {mods}"
          print(f"✅ Modifier detection: {mods}")

          # Test 3: priority scoring (uses thresholds from XML)
          assert _score_priority("HEALTH_WELLNESS", 0.85) == "HIGH"
          assert _score_priority("HEALTH_WELLNESS", 0.70) == "MEDIUM"
          assert _score_priority("HEALTH_WELLNESS", 0.45) == "LOW"
          print("✅ Priority scoring")

          # Test 4: matrix structure
          matrix = _get_matrix("HEALTH_WELLNESS")
          assert "SUBJECT" in matrix, "Missing SUBJECT row"
          assert "ACTION"  in matrix, "Missing ACTION row"
          assert "CONTEXT" in matrix, "Missing CONTEXT row"
          assert "primary" in matrix["SUBJECT"], "Missing primary cell"
          print("✅ Matrix structure")

          # Test 5: pillar defs loaded from XML
          defs = get_pillar_defs()
          assert "HEALTH_WELLNESS" in defs
          assert "LOVE"            in defs
          assert "URGENCY"         in defs
          assert defs["LOVE"]["type"] == "emotion"
          assert defs["URGENCY"]["classification"] == "keyword"
          print(f"✅ Pillar defs: {len(defs)} pillars loaded from XML")

          # Test 6: DIMENSION_ORDER is exactly 28
          assert len(DIMENSION_ORDER) == 28, \
              f"DIMENSION_ORDER should be 28, got {len(DIMENSION_ORDER)}"
          print(f"✅ DIMENSION_ORDER: {len(DIMENSION_ORDER)} dims")

          print("\n✅ All unit tests passed")
          PYEOF

      # ── 8. Cache isolation test ──────────────────────────────────────────────
      - name: Cache isolation test
        run: |
          python3 - << 'PYEOF'
          import sys, types

          sys.modules["supabase"] = types.ModuleType("supabase")
          mock_store = types.ModuleType("supabase_store")
          mock_store.get_client = lambda: None
          sys.modules["supabase_store"] = mock_store
          sys.modules["google"] = types.ModuleType("google")
          sys.modules["google.genai"] = types.ModuleType("google.genai")

          from memory.cache.cache_memory import _update_slot, get_active_slots, clear_cache

          # Write to two different sessions
          _update_slot("core", "HEALTH_WELLNESS", "CORE", session_id="session-A")
          _update_slot("core", "FINANCE",         "CORE", session_id="session-B")

          slots_a = get_active_slots(session_id="session-A")
          slots_b = get_active_slots(session_id="session-B")

          val_a = next((s["value"] for s in slots_a if s["key"] == "core"), None)
          val_b = next((s["value"] for s in slots_b if s["key"] == "core"), None)

          assert val_a == "HEALTH_WELLNESS", f"Session A corrupted: {val_a}"
          assert val_b == "FINANCE",         f"Session B corrupted: {val_b}"
          assert val_a != val_b,             "Sessions are bleeding into each other!"

          clear_cache()
          print("✅ Cache isolation: sessions are fully isolated")
          PYEOF

      # ── 9. Requirements sanity check ─────────────────────────────────────────
      - name: Check requirements.txt
        run: |
          python3 - << 'PYEOF'
          required = [
              "fastapi", "uvicorn", "supabase",
              "anthropic", "openai", "google-genai",
              "python-dotenv",
          ]
          with open("requirements.txt") as f:
              content = f.read().lower()
          missing = [pkg for pkg in required if pkg.lower() not in content]
          if missing:
              print(f"❌ Missing from requirements.txt: {missing}")
              import sys; sys.exit(1)
          print("✅ requirements.txt has all required packages")
          PYEOF
